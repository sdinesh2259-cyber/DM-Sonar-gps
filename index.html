<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Odukan Sonar & Big Compass Pro</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b132b'/%3E%3Cpath d='M20 62 L80 62 L70 78 L30 78 Z' fill='%2300ffcc' stroke='%23ffffff' stroke-width='2'/%3E%3Cpath d='M50 20 L50 62 M50 24 L74 54 L50 54 Z' fill='%23ffcc00' stroke='%23ffffff' stroke-width='2'/%3E%3C/svg%3E">
  
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; font-family: sans-serif; user-select: none; background: #010810; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }

    /* Top Sonar Full Screen View */
    .sonar-section {
      flex: 1; position: relative; display: flex; flex-direction: column; background: #010810; overflow: hidden; border-bottom: 2px solid #1a3a5a;
    }
    .top-sonar-header {
      background: #040d1a; padding: 8px 12px; display: flex; justify-content: flex-end; align-items: center; z-index: 100;
    }
    .bt-connect-btn {
      background: #1d3557; border: 2px solid #00ffcc; color: #fff; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    #sonarCanvas { flex: 1; width: 100%; height: 100%; display: block; }

    /* Bottom Center Compass & Depth/Bottom Section */
    .bottom-compass-section {
      background: #071628; border-top: 2px solid #ffcc00; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 -4px 20px rgba(0,0,0,0.9); z-index: 100; position: relative; transition: all 0.3s ease;
    }
    
    /* Full Screen Compass Mode */
    .bottom-compass-section.fullscreen-compass {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #020b14; flex-direction: column; justify-content: center; align-items: center; gap: 30px; z-index: 99999; padding: 20px;
    }
    .bottom-compass-section.fullscreen-compass .compass-large-dial {
      width: 250px !important; height: 250px !important; border-width: 6px !important;
    }
    .bottom-compass-section.fullscreen-compass .c-label { font-size: 20px !important; }
    .bottom-compass-section.fullscreen-compass .lbl-n { top: 8px !important; }
    .bottom-compass-section.fullscreen-compass .lbl-s { bottom: 8px !important; }
    .bottom-compass-section.fullscreen-compass .lbl-e { right: 12px !important; }
    .bottom-compass-section.fullscreen-compass .lbl-w { left: 12px !important; }

    .bottom-compass-section.fullscreen-compass .compass-large-needle {
      height: 180px !important; width: 14px !important;
    }
    .bottom-compass-section.fullscreen-compass .arrow-head { border-left-width: 16px; border-right-width: 16px; border-bottom-width: 75px; }
    .bottom-compass-section.fullscreen-compass .arrow-tail { width: 6px; height: 105px; }
    .bottom-compass-section.fullscreen-compass .heading-deg { font-size: 60px !important; text-align: center; }
    .bottom-compass-section.fullscreen-compass .speed-label { font-size: 20px !important; text-align: center; }
    .bottom-compass-section.fullscreen-compass .close-fs-hint { display: block !important; }
    .bottom-compass-section.fullscreen-compass .side-hud-box { display: none !important; }
    .bottom-compass-section.fullscreen-compass .center-compass-group { flex-direction: column; align-items: center; gap: 15px; }

    .close-fs-hint { display: none; position: absolute; top: 20px; right: 20px; background: #e63946; color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; }

    .center-compass-group { display: flex; align-items: center; gap: 12px; cursor: pointer; }

    .compass-large-dial {
      width: 68px; height: 68px; border-radius: 50%; border: 3px solid #ffcc00;
      background: #000; position: relative; display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 0 10px rgba(0,255,204,0.5);
    }
    .c-label { position: absolute; font-size: 9px; font-weight: bold; color: #fff; }
    .lbl-n { top: 2px; color: #ff0000; }
    .lbl-s { bottom: 2px; }
    .lbl-e { right: 4px; }
    .lbl-w { left: 4px; }
    
    .compass-large-needle {
      width: 5px; height: 44px; position: absolute; display: flex; flex-direction: column; align-items: center; transition: transform 0.1s linear;
    }
    .arrow-head { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 18px solid #00ffcc; }
    .arrow-tail { width: 2px; height: 26px; background: #ffffff; }

    .compass-info-box { display: flex; flex-direction: column; justify-content: center; }
    .heading-deg { font-size: 22px; font-weight: bold; color: #00ffcc; font-family: monospace; line-height: 1; }
    .speed-label { font-size: 11px; color: #ffcc00; font-family: monospace; margin-top: 3px; font-weight: bold; }

    /* Left & Right Side HUD Boxes near Compass */
    .side-hud-box {
      background: rgba(5, 20, 34, 0.95); border: 1.5px solid #1f3a60; padding: 6px 10px; border-radius: 8px; min-width: 105px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.7);
    }
    .hud-title { font-size: 8px; color: #888; font-weight: bold; }
    .hud-value { font-size: 12px; font-weight: bold; color: #ffcc00; font-family: monospace; margin-top: 2px; }

    /* Bottom Control Bar */
    .bottom-control-bar {
      height: 50px; background: #040d1a; border-top: 1px solid #1a3a5a; display: flex; align-items: center; justify-content: space-around; padding: 4px; z-index: 100;
    }
    .ctrl-btn {
      flex: 1; margin: 0 3px; height: 38px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .btn-spot { background: #e63946; }
    .btn-search { background: #2a9d8f; }
    .btn-sonar-on { background: #0077b6; border: 1px solid #00ffcc; }
    .btn-export { background: #1d3557; }

    /* Modals */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 20000; display: none; align-items: center; justify-content: center;
    }
    .modal-content {
      background: #111; color: #fff; padding: 16px; border-radius: 12px; width: 90%; max-width: 320px; border: 1px solid #444;
    }
    .modal-title { font-size: 14px; font-weight: bold; color: #ffcc00; margin-bottom: 10px; text-align: center; }
    .input-group { margin-bottom: 10px; }
    .input-group label { font-size: 11px; color: #00ffcc; display: block; margin-bottom: 3px; }
    .input-box { width: 100%; background: #000; color: #00ffcc; border: 1px solid #444; padding: 8px; border-radius: 6px; font-size: 14px; font-family: monospace; font-weight: bold; }
    .modal-btn-row { display: flex; gap: 6px; margin-top: 10px; }
    .modal-btn { flex: 1; padding: 8px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 11px; }
    .btn-save { background: #2a9d8f; color: #fff; }
    .btn-cancel { background: #e63946; color: #fff; }
  </style>
</head>
<body>

  <!-- Top Sonar Section -->
  <div class="sonar-section">
    <div class="top-sonar-header">
      <button class="bt-connect-btn" id="btSonarBtn" onclick="connectBluetoothSonar()">
        📡 சோனார் இணை
      </button>
    </div>
    <canvas id="sonarCanvas"></canvas>
  </div>

  <!-- Bottom Compass & Depth/Bottom Section -->
  <div class="bottom-compass-section" id="compassSection">
    <div class="close-fs-hint" onclick="event.stopPropagation(); toggleFullscreenCompass();">✖ மூடு</div>
    
    <!-- Left Side: Depth -->
    <div class="side-hud-box">
      <div class="hud-title">ஆழம் (DEPTH)</div>
      <div class="hud-value" id="liveDepthVal">12.4 பாவம்</div>
    </div>

    <!-- Center Compass & Speed Group -->
    <div class="center-compass-group" onclick="toggleFullscreenCompass()">
      <div class="compass-large-dial">
        <span class="c-label lbl-n">N</span>
        <span class="c-label lbl-s">S</span>
        <span class="c-label lbl-e">E</span>
        <span class="c-label lbl-w">W</span>
        <div class="compass-large-needle" id="bigNeedle">
          <div class="arrow-head"></div>
          <div class="arrow-tail"></div>
        </div>
      </div>

      <div class="compass-info-box">
        <div class="heading-deg" id="largeHeadingVal">0° N</div>
        <div class="speed-label" id="boatSpeedVal">வேகம்: 0.0 kts</div>
      </div>
    </div>

    <!-- Right Side: Seabed Type -->
    <div class="side-hud-box" style="text-align: center;">
      <div class="hud-title">தரை நிலை</div>
      <div class="hud-value" id="liveBottomVal" style="color: #00ffcc;">🪨 பாறை (Reef)</div>
    </div>
  </div>

  <!-- Bottom Control Bar -->
  <div class="bottom-control-bar">
    <button class="ctrl-btn btn-spot" onclick="openSpotModal()">📍 பார் சேமி</button>
    <button class="ctrl-btn btn-search" onclick="openCoordModal()">🔍 எண் தேடு</button>
    <button class="ctrl-btn btn-sonar-on" onclick="toggleSonarScan()">⚡ ஸ்கேன்</button>
    <button class="ctrl-btn btn-export" onclick="exportSavedData()">💾 எடு</button>
  </div>

  <!-- Spot Save Modal -->
  <div class="modal-overlay" id="spotModal">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-title">📍 தற்போதைய பார் சேமிக்க</div>
      <div class="input-group">
        <label>பார் பெயர்:</label>
        <input type="text" id="spotNameInput" class="input-box" placeholder="எ.கா. பாறை பார்">
      </div>
      <div class="input-group">
        <label>ஜிபிஎஸ் ஒருங்கிணைப்பு:</label>
        <div id="currentCoordDisplay" style="font-family:monospace; color:#00ffcc; font-size:12px; background:#000; padding:6px; border-radius:4px;">--</div>
      </div>
      <div class="modal-btn-row">
        <button class="modal-btn btn-save" onclick="saveCurrentSpot()">💾 சேமி</button>
        <button class="modal-btn btn-cancel" onclick="document.getElementById('spotModal').style.display='none'">ரத்து</button>
      </div>
    </div>
  </div>

  <!-- Coord Search Modal -->
  <div class="modal-overlay" id="coordModal">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-title">🔍 ஜிபிஎஸ் எண் தேடல்</div>
      <div class="input-group">
        <label>Latitude மினிட்:</label>
        <input type="number" id="searchLatMin" class="input-box" placeholder="49.406" step="any">
      </div>
      <div class="input-group">
        <label>Longitude மினிட்:</label>
        <input type="number" id="searchLngMin" class="input-box" placeholder="8.972" step="any">
      </div>
      <div class="modal-btn-row">
        <button class="modal-btn btn-save" onclick="executeCoordSearch()">🚀 தேடு</button>
        <button class="modal-btn btn-cancel" onclick="document.getElementById('coordModal').style.display='none'">ரத்து</button>
      </div>
    </div>
  </div>

  <script>
    let currentLat = 8.8238;
    let currentLng = 78.1567;
    let currentHeading = 0;
    let isScanning = true;
    let isFsCompass = false;

    function getHeadingDir(deg) {
      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      return dirs[Math.round(deg / 45) % 8];
    }

    function toggleFullscreenCompass() {
      isFsCompass = !isFsCompass;
      const comp = document.getElementById('compassSection');
      if(isFsCompass) {
        comp.classList.add('fullscreen-compass');
      } else {
        comp.classList.remove('fullscreen-compass');
      }
    }

    async function connectBluetoothSonar() {
      try {
        if (!navigator.bluetooth) { alert("புளூடூத் ஆதரவு இல்லை!"); return; }
        alert("📡 புளூடூத் சோனார் தேடுகிறது...");
        const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['battery_service'] });
        await device.gatt.connect();
        document.getElementById('btSonarBtn').style.background = '#2a9d8f';
        alert("✅ இணைக்கப்பட்டது: " + device.name);
      } catch (err) { alert("⚠️ இணைப்பு ரத்து செய்யப்பட்டது."); }
    }

    function toggleSonarScan() {
      isScanning = !isScanning;
      alert(isScanning ? "⚡ ஸ்கேனிங் தொடங்கப்பட்டது!" : "⏸️ ஸ்கேனிங் நிறுத்தப்பட்டது.");
    }

    function formatCoord(val, isLat) {
      const abs = Math.abs(val);
      const deg = Math.floor(abs);
      const min = ((abs - deg) * 60).toFixed(3);
      const dir = isLat ? (val >= 0 ? "N" : "S") : (val >= 0 ? "E" : "W");
      return `${deg}° ${min}' ${dir}`;
    }

    function openSpotModal() {
      document.getElementById('currentCoordDisplay').innerText = `${formatCoord(currentLat, true)} | ${formatCoord(currentLng, false)}`;
      document.getElementById('spotNameInput').value = "பார் " + new Date().toLocaleTimeString();
      document.getElementById('spotModal').style.display = 'flex';
    }

    function saveCurrentSpot() {
      let name = document.getElementById('spotNameInput').value.trim();
      let saved = JSON.parse(localStorage.getItem('marineReefs') || '[]');
      saved.push({ id: Date.now(), name: name, lat: currentLat, lng: currentLng, nautical_north: formatCoord(currentLat, true) });
      localStorage.setItem('marineReefs', JSON.stringify(saved));
      document.getElementById('spotModal').style.display = 'none';
      alert("📍 " + name + " சேமிக்கப்பட்டது!");
    }

    function openCoordModal() {
      document.getElementById('coordModal').style.display = 'flex';
    }

    function executeCoordSearch() {
      let mLat = parseFloat(document.getElementById('searchLatMin').value);
      let mLng = parseFloat(document.getElementById('searchLngMin').value);
      if(!isNaN(mLat) && !isNaN(mLng)) {
        alert("🎯 இலக்கு கண்டறியப்பட்டது!");
        document.getElementById('coordModal').style.display = 'none';
      } else { alert("சரியான எண்களை உள்ளிடவும்!"); }
    }

    function exportSavedData() {
      const dataStr = localStorage.getItem('marineReefs') || '[]';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([dataStr], { type: 'application/json' }));
      a.download = `Odukan_Spots_${new Date().toLocaleDateString()}.json`;
      a.click();
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(pos => {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;
        let speed = pos.coords.speed ? (pos.coords.speed * 1.94384) : 0;
        if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
          currentHeading = Math.round(pos.coords.heading);
        }

        document.getElementById('boatSpeedVal').innerText = `வேகம்: ${speed.toFixed(1)} kts`;
        document.getElementById('largeHeadingVal').innerText = `${currentHeading}° ${getHeadingDir(currentHeading)}`;
        
        const needle = document.getElementById('bigNeedle');
        if (needle) needle.style.transform = `rotate(${currentHeading}deg)`;
      }, () => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    }

    // Sonar Canvas Animation
    const canvas = document.getElementById('sonarCanvas');
    const ctx = canvas.getContext('2d');
    
    let fishList = [
      {x: 80, y: 50, s: 1.5, size: 16, color: '#ffcc00'},
      {x: 220, y: 90, s: 1.0, size: 12, color: '#00ffcc'},
      {x: 350, y: 60, s: 1.8, size: 18, color: '#ff5722'}
    ];

    function drawSonar() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight - 40;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (!isScanning) return;

      // Seabed
      ctx.beginPath();
      ctx.fillStyle = '#03192f';
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 3;
      ctx.moveTo(0, canvas.height);
      for(let x=0; x<=canvas.width; x+=3) {
        ctx.lineTo(x, canvas.height - 40 + Math.sin((x + Date.now()/25)/50) * 12);
      }
      ctx.lineTo(canvas.width, canvas.height);
      ctx.fill();
      ctx.stroke();

      // Fish
      fishList.forEach(f => {
        f.x -= f.s;
        if (f.x < -40) f.x = canvas.width + 40;

        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.ellipse(f.x, f.y, f.size, f.size/2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(f.x + f.size, f.y);
        ctx.lineTo(f.x + f.size + 10, f.y - 8);
        ctx.lineTo(f.x + f.size + 10, f.y + 8);
        ctx.closePath();
        ctx.fill();
      });

      requestAnimationFrame(drawSonar);
    }
    drawSonar();
  </script>
</body>
</html>
